name: synctask
description: Local-first cross-platform task manager with device sync.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.4.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.3
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  file_picker: ^13.3.0
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_ai.png
