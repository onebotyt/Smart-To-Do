name: Build Android and Windows Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android Release APKs
        run: |
          flutter build apk --release --dart-define=APP_VERSION=0.1.${{ github.run_number }}
          flutter build apk --release --split-per-abi --dart-define=APP_VERSION=0.1.${{ github.run_number }}

      - name: Upload Android Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: synctask-android-release-universal
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: synctask-android-release-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows Desktop Release
        run: flutter build windows --release --dart-define=APP_VERSION=0.1.${{ github.run_number }}

      - name: Sign Windows Executable
        shell: pwsh
        run: |
          .\windows\sign.ps1 -FilePath "build\windows\x64\runner\Release\synctask.exe"

      - name: Copy Install Scripts to Bundle
        shell: pwsh
        run: |
          Copy-Item "windows\Install-SyncTask.cmd" -Destination "build\windows\x64\runner\Release\"
          Copy-Item "windows\Install-SyncTask.ps1" -Destination "build\windows\x64\runner\Release\"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile Windows Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=0.1.${{ github.run_number }}" windows\installer.iss

      - name: Sign Setup Installer
        shell: pwsh
        run: |
          .\windows\sign.ps1 -FilePath "SyncTask-Setup.exe"

      - name: Compress Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "synctask-windows-release.zip"

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: synctask-windows-release
          path: synctask-windows-release.zip

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: synctask-windows-setup
          path: SyncTask-Setup.exe

  release:
    name: Publish Auto-Versioned GitHub Release
    needs: [build-android, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Universal APK
        uses: actions/download-artifact@v4
        with:
          name: synctask-android-release-universal

      - name: Download Android arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: synctask-android-release-arm64

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: synctask-windows-release

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: synctask-windows-setup

      - name: Prepare Assets with Auto-Versioning
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          echo "VERSION_TAG=$VERSION" >> $GITHUB_ENV
          cp app-release.apk "SyncTask-Android.apk"
          cp app-release.apk "SyncTask-${VERSION}-android-universal.apk"
          cp app-arm64-v8a-release.apk "SyncTask-Android-arm64.apk"
          cp app-arm64-v8a-release.apk "SyncTask-${VERSION}-android-arm64.apk"
          cp synctask-windows-release.zip "SyncTask-${VERSION}-windows.zip"
          cp synctask-windows-release.zip "SyncTask-Windows.zip"
          cp SyncTask-Setup.exe "SyncTask-${VERSION}-windows-setup.exe"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: SyncTask ${{ env.VERSION_TAG }}
          draft: false
          prerelease: false
          body: |
            ## SyncTask ${{ env.VERSION_TAG }}
            
            Automated production release generated from commit `${{ github.sha }}`.

            ### 🚀 Direct One-Click Downloads
            - 💻 **Windows Desktop Installer (Recommended)**: [SyncTask-Setup.exe](https://github.com/onebotyt/Smart-To-Do/releases/download/${{ env.VERSION_TAG }}/SyncTask-Setup.exe) *(Standard Windows Setup Wizard)*
            - 💻 **Windows Portable Bundle**: [SyncTask-Windows.zip](https://github.com/onebotyt/Smart-To-Do/releases/download/${{ env.VERSION_TAG }}/SyncTask-Windows.zip)
            - 📱 **Android (Lightweight ~20MB, for all modern phones)**: [SyncTask-Android-arm64.apk](https://github.com/onebotyt/Smart-To-Do/releases/download/${{ env.VERSION_TAG }}/SyncTask-Android-arm64.apk)
            - 📱 **Android (Universal, all architectures)**: [SyncTask-Android.apk](https://github.com/onebotyt/Smart-To-Do/releases/download/${{ env.VERSION_TAG }}/SyncTask-Android.apk)
          files: |
            SyncTask-Setup.exe
            SyncTask-Windows.zip
            SyncTask-Android.apk
            SyncTask-Android-arm64.apk
            SyncTask-${{ env.VERSION_TAG }}-windows-setup.exe
            SyncTask-${{ env.VERSION_TAG }}-windows.zip
            SyncTask-${{ env.VERSION_TAG }}-android-universal.apk
            SyncTask-${{ env.VERSION_TAG }}-android-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository to update README
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README with Latest Release Version
        run: |
          sed -i -E "s/v0\.1\.[0-9]+/${{ env.VERSION_TAG }}/g" README.md || true
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: auto-update README to ${{ env.VERSION_TAG }} [skip ci]" && git push origin main) || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
