name: Build Android and Windows Apps

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: synctask-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Compress Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "synctask-windows-release.zip"

      - name: Upload Windows Bundle
        uses: actions/upload-artifact@v4
        with:
          name: synctask-windows-release
          path: synctask-windows-release.zip

  release:
    name: Publish Auto-Versioned GitHub Release
    needs: [build-android, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: synctask-android-debug-apk

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: synctask-windows-release

      - name: Prepare Assets with Auto-Versioning
        run: |
          VERSION="v0.1.${{ github.run_number }}"
          echo "VERSION_TAG=$VERSION" >> $GITHUB_ENV
          mv app-debug.apk "SyncTask-${VERSION}-android.apk"
          mv synctask-windows-release.zip "SyncTask-${VERSION}-windows.zip"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: SyncTask ${{ env.VERSION_TAG }}
          draft: false
          prerelease: false
          body: |
            ## SyncTask ${{ env.VERSION_TAG }}
            
            Automated release generated from commit `${{ github.sha }}`.

            ### Downloads
            - 📱 **Android APK**: `SyncTask-${{ env.VERSION_TAG }}-android.apk`
            - 💻 **Windows Application (Zip)**: `SyncTask-${{ env.VERSION_TAG }}-windows.zip`

            ### What's New
            - Cross-platform task manager with SQLite storage
            - Category chips & Pending/Completed view toggle
            - Transactional change log for future device-to-device sync
          files: |
            SyncTask-${{ env.VERSION_TAG }}-android.apk
            SyncTask-${{ env.VERSION_TAG }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
