<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#1A253C" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Task Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Golden Checkmark Badge Gradient (Matching User's To-Do Screenshot) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Cyan Accent Gradient for Sync Orbit -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.55" />
    </filter>

    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#F59E0B" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Squircle Base with Metallic Glowing Border -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="4" />

  <!-- 2. Subtle Background Grid Texture -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.1" stroke-dasharray="6 6" />

  <!-- 3. Back Task Sheet (Layered Depth) -->
  <g filter="url(#cardShadow)">
    <rect x="156" y="88" width="216" height="264" rx="24" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="2" transform="rotate(-6 264 220)" />
  </g>

  <!-- 4. Main Foreground Task Clipboard / Sheet -->
  <g filter="url(#cardShadow)">
    <rect x="128" y="112" width="256" height="300" rx="28" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />

    <!-- Top Clip Element -->
    <rect x="212" y="98" width="88" height="28" rx="10" fill="#38BDF8" />
    <circle cx="256" cy="112" r="5" fill="#0F172A" />

    <!-- Task Lines (Clean Minimalist Rounded Bars with color category dots) -->
    <!-- Task Row 1 -->
    <circle cx="168" cy="176" r="10" fill="none" stroke="#38BDF8" stroke-width="3.5" />
    <rect x="194" y="170" width="148" height="12" rx="6" fill="#94A3B8" fill-opacity="0.8" />

    <!-- Task Row 2 -->
    <circle cx="168" cy="226" r="10" fill="none" stroke="#F59E0B" stroke-width="3.5" />
    <rect x="194" y="220" width="120" height="12" rx="6" fill="#94A3B8" fill-opacity="0.8" />

    <!-- Task Row 3 -->
    <circle cx="168" cy="276" r="10" fill="none" stroke="#10B981" stroke-width="3.5" />
    <rect x="194" y="270" width="136" height="12" rx="6" fill="#94A3B8" fill-opacity="0.8" />

    <!-- Task Row 4 -->
    <circle cx="168" cy="326" r="10" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="3 3" />
    <rect x="194" y="320" width="92" height="12" rx="6" fill="#64748B" fill-opacity="0.5" />
  </g>

  <!-- 5. Seamless P2P Sync Arc Orbit (Representing SyncTask) -->
  <path d="M 96,350 A 180,180 0 0,1 416,350" fill="none" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-dasharray="8 8" stroke-opacity="0.5" />

  <!-- 6. Prominent Golden Completion Checkmark Badge (Matching User's To-Do App screenshot) -->
  <g filter="url(#badgeShadow)">
    <!-- Golden Circular Badge -->
    <circle cx="366" cy="358" r="78" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4.5" />

    <!-- Bold Precision Checkmark -->
    <path d="M 326 358 L 354 386 L 412 328" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
