<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Card Ambient & Drop Shadow -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- 3D Layer Fold Shadow where Right Arm overlaps Left Arm -->
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="5" stdDeviation="5" flood-color="#0A346E" flood-opacity="0.38" />
    </filter>

    <!-- Subtle Checkmark Ambient Elevation Shadow -->
    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#185ABD" flood-opacity="0.22" />
    </filter>

    <!-- Vibrant Sky Blue Gradient for Right Arm (Microsoft To Do Authentic Spectrum) -->
    <linearGradient id="skyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#186AD4" />
      <stop offset="48%" stop-color="#2896EA" />
      <stop offset="100%" stop-color="#55BDF4" />
    </linearGradient>

    <!-- Subtle White Card Rim Stroke -->
    <linearGradient id="cardRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <!-- 1. Universal Circular White Base (Native fit for round floating bubbles & circular icons) -->
  <circle cx="256" cy="256" r="236" fill="#FFFFFF" stroke="url(#cardRim)" stroke-width="2.5" filter="url(#cardShadow)" />

  <!-- 2. The Iconic Two-Tone Microsoft To-Do Style Checkmark -->
  <g filter="url(#checkGlow)">
    <!-- Left Arm: Deep Cobalt Royal Blue (#185ABD) -->
    <line x1="154" y1="242" x2="230" y2="318" stroke="#185ABD" stroke-width="76" stroke-linecap="round" />

    <!-- Right Arm with Layered Overlap: Vibrant Sky Blue Gradient (#186AD4 -> #55BDF4) -->
    <g filter="url(#foldShadow)">
      <line x1="226" y1="322" x2="358" y2="190" stroke="url(#skyGrad)" stroke-width="76" stroke-linecap="round" />
    </g>
  </g>
</svg>
